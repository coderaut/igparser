[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-recipe-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "typer>=0.12.0",
    "yt-dlp>=2024.11.18",
]

[tool.setuptools]
py-modules = ["main", "downloader", "transcriber", "caption", "recipe"]

[project.scripts]
igrecipe = "main:app"
