services:
  ig-parser:
    build: .
    container_name: ig-parser
    restart: unless-stopped
    ports:
      - "0.0.0.0:8501:8501"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COOKIES_FILE=/cookies/instagram.txt
      - LOG_DIR=/logs
    volumes:
      - ./cookies:/cookies
      - ./logs:/logs
